name: Mili CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      force-release:
        description: "Force disable release if you enter 2, force release if you enter 1, default release if not released else skip release"
        required: false
        default: ""
      force-push:
        description: "Force disable push to repo if you enter 2, force push to repo if you enter 1, default push if not released else skip push repo"
        required: false
        default: ""
      comments:
        description: "Add comments to release"
        required: false
        default: ""

permissions: write-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: default
    timeout-minutes: 60
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # 核心改动：优化 Gradle 缓存配置
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}
          gradle-home-cache-cleanup: true
          cache-exclude: |
            **/paperweight/**
            **/caches/paperweight/**

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git User Details
        run: |
          git config --global user.email "ci@luminolmc.com"
          git config --global user.name "LuminolMC CI"
          git config --global advice.mergeConflict false
          git config --global init.defaultBranch main

      - name: Clean paperweight caches (aggressive)
        run: |
          echo "=== Pre-clean state ==="
          rm -rf mili-server/build mili-api/build
          find . -type d -name "taskCache" -path "*/paperweight/*" -exec rm -rf {} + 2>/dev/null || true
          echo "=== Post-clean state ==="
          ls -la .gradle/caches/paperweight 2>/dev/null || echo "paperweight cache removed"

      - name: Apply All Patches
        run: ./gradlew --refresh-dependencies applyAllPatches

      - name: Build Paperclip Jar
        run: ./gradlew createMojmapPaperclipJar

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.project_id_b }} CI Artifacts
          path: mili-server/build/libs/*-paperclip-*-mojmap.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: true
          include-hidden-files: false

      - name: Set Environment
        if: github.event_name != 'pull_request'
        run: sh scripts/SetENV.sh

      - name: Check If Release Exists
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          git fetch --tags
          if [ -n "$(git tag -l "${{ env.tag }}")" ]; then
            echo "Release already exists"
            release_exists=true
          else
            echo "Release does not exist"
            release_exists=false
          fi
          if [ "$release_exists" == "true" ]; then
            counter=1
            while [ -n "$(git tag -l "${{ env.tag }}-${counter}")" ]; do
              counter=$((counter + 1))
            done
            echo "tag=${{ env.tag }}-${counter}" >> $GITHUB_ENV
            echo "release_count= - ${counter}" >> $GITHUB_ENV
          fi
          echo "release_exists=${release_exists}" >> $GITHUB_ENV

      - name: Check If Branch In Expectations
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          if [[ "$GITHUB_REF_NAME" == ver/* ]] || [[ "$GITHUB_REF_NAME" == exp/* ]] || [[ "$GITHUB_REF_NAME" == dev/* ]] || [[ "$GITHUB_REF_NAME" == master ]]; then
            echo "Branch is in expected prefixes"
            echo "unexpect=false" >> $GITHUB_ENV
          else
            echo "Branch is NOT in expected prefixes"
            echo "unexpect=true" >> $GITHUB_ENV
          fi

      - name: Publish To Repo
        if: ( github.event_name != 'pull_request' && !( env.unexpect == 'true' ) && env.flag_release == 'true' && env.release_exists != 'true' && !( inputs.force-release == '2' )) || inputs.force-push == '1'
        continue-on-error: true
        run: ./gradlew generateDevelopmentBundle publish -PpublishDevBundle=true
        env:
          PRIVATE_MAVEN_REPO_PASSWORD: ${{ secrets.PRIVATE_MAVEN_REPO_PASSWORD }}
          PRIVATE_MAVEN_REPO_USERNAME: ${{ secrets.PRIVATE_MAVEN_REPO_USERNAME }}

      - name: Create Release - Pre Process
        if: ( github.event_name != 'pull_request' && !( env.unexpect == 'true' ) && env.flag_release == 'true' && env.release_exists != 'true' && !(inputs.force-release == '2')) || inputs.force-release == '1'
        run: |
          if [ "${{ inputs.comments }}" == "" ]; then
            echo "No comments provided"
            echo "flag_comment=false" >> $GITHUB_ENV
          else
            echo "Comments provided: ${{ inputs.comments }}"
            echo "flag_comment=true" >> $GITHUB_ENV
          fi

      - name: Create Release - No Comment
        if: env.flag_comment == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} ${{ env.mcversion }} - ${{ env.commit_id }}${{ env.release_count }}
          body: |
            📦Version: `${{ env.mcversion }}` | Commit ${{ env.commit_id }} [![download](https://img.shields.io/github/downloads/LuminolMC/${{ env.project_id }}/${{ env.tag }}/total?color=red&style=flat-square)](https://github.com/xucy10/${{ env.project_id }}/releases/download/${{ env.tag }}/${{ env.jar }})
            This release is automatically compiled by GitHub Actions
            ### Branch Info
            > ${{ github.ref_name }}
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: ${{ env.jar_dir }}
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release - With Comment
        if: env.flag_comment == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} ${{ env.mcversion }} - ${{ env.commit_id }}${{ env.release_count }}
          body: |
            📦Version: `${{ env.mcversion }}` | Commit ${{ env.commit_id }} [![download](https://img.shields.io/github/downloads/LuminolMC/${{ env.project_id }}/${{ env.tag }}/total?color=red&style=flat-square)](https://github.com/xucy10/${{ env.project_id }}/releases/download/${{ env.tag }}/${{ env.jar }})
            This release is automatically compiled by GitHub Actions
            ### Comments
            > ${{ inputs.comments }}
            ### Branch Info
            > ${{ github.ref_name }}
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: ${{ env.jar_dir }}
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}