name: mili CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      force-release:
        description: "Force release control"
        required: false
        default: ""
      force-push:
        description: "Force push control"
        required: false
        default: ""
      comments:
        description: "Add comments to release"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUST_TARGETS: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Repair submodules & paperweight cache (prevent corrupted upstreams)
        run: |
          set -eux

          git submodule deinit -f --all || true

          rm -rf .git/modules || true

          git submodule init
          git submodule sync --recursive

          git submodule update --init --recursive --force

          git submodule foreach --recursive '
            echo "=== Submodule: $name ==="
            if git rev-parse --is-shallow-repository >/dev/null 2>&1 && [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow --tags || git fetch --all --tags || true
            else
              git fetch --all --tags || true
            fi
            git reset --hard || true
            git clean -fdx || true
          '

          rm -rf .gradle/caches/paperweight || true
          rm -rf .gradle/caches/paperweight/upstreams || true

          git status --porcelain --untracked-files=all || true
          ls -la .gradle/caches || true

      # Fail fast on malformed patches. A hand-edited hunk body whose `@@ -a,b +c,d @@`
      # counts are stale makes `git am` abort with "corrupt patch at ...", which is
      # expensive to debug after the full patch pipeline has already run.
      # Only the two directories whose patches are actually applied are checked strictly.
      # `todo/` and `unpatched/` are parking areas and are deliberately not applied, so a
      # work-in-progress patch there must not fail the build.
      - name: Validate patch files
        run: |
          set -eux
          python3 scripts/check_patch_hunks.py \
            mili-server/minecraft-patches/features \
            mili-server/paper-patches/features

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      # xucy10/Milihyacinthus is a paperweight fork rebranded to the vanilla
      # io.papermc.paperweight plugin ids; repo.menthamc.org is offline/parked,
      # so the plugin must be published to mavenLocal from source before any gradle task can resolve it.
      - name: Publish Milihyacinthus (paperweight fork) to mavenLocal
        run: |
          set -eux
          git clone --depth 1 https://github.com/xucy10/Milihyacinthus.git hyacinthusweight-src
          cd hyacinthusweight-src
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon
          cd ..
          rm -rf hyacinthusweight-src

      - name: Download Riceear (Hyacinthusclip fork)
        run: |
          mkdir -p libs
          CLIP_VERSION=$(grep clipVersion gradle.properties | cut -d= -f2)
          echo "Downloading riceear v${CLIP_VERSION}"
          curl -sL "https://github.com/xucy10/Hyacinthusclip/releases/download/v${CLIP_VERSION}/riceear-${CLIP_VERSION}.jar" -o libs/riceear.jar
          if [ ! -s libs/riceear.jar ]; then
            echo "ERROR: Failed to download riceear jar"
            exit 1
          fi
          ls -la libs/riceear.jar

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install system cross toolchains and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y clang lld build-essential pkg-config curl git
          sudo apt-get install -y libssl-dev zlib1g-dev

      - name: Install cargo-zigbuild
        run: |
          cargo install cargo-zigbuild --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify toolchain and linkers
        run: |
          rustc --version
          cargo --version
          zig version
          if command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo-zigbuild --version
          else
            echo "WARN: cargo-zigbuild not available"
          fi
          which x86_64-w64-mingw32-gcc || echo "mingw not found in PATH"
          which aarch64-linux-gnu-gcc || echo "aarch64 cross-gcc not found in PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git User Details
        run: |
          git config --global user.email "282142033+xucy10@users.noreply.github.com"
          git config --global user.name "Mili CI"
          git config --global advice.mergeConflict false
          git config --global init.defaultBranch main

      - name: Clean build artifacts
        run: |
          rm -rf mili-server/build mili-api/build
          rm -rf mili-server/src/minecraft
          rm -rf .gradle/caches/paperweight
          rm -rf .gradle/configuration-cache

      - name: Build Rust Optimizer (cross targets)
        env:
          RUST_TARGETS: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -eux
          export PATH="$PATH:$HOME/.cargo/bin"
          export CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc
          export CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++
          ./gradlew :mili-rust:stageRustBinary --no-configuration-cache

      - name: Verify Rust Optimizer Binary
        run: |
          echo "=== Listing staged output ==="
          ls -la mili-rust/build/rust/ 2>/dev/null || true
          echo "=== Listing cargo-target ==="
          find mili-rust/build/cargo-target -type f \( -name "*.so" -o -name "*.dll" \) 2>/dev/null || true
          
          mkdir -p mili-rust/build/rust
          for f in mili-rust/build/cargo-target/*/release/libmili_optimizer.so \
                   mili-rust/build/cargo-target/*/release/mili_optimizer.so; do
            if [ -f "$f" ]; then
              cp "$f" mili-rust/build/rust/mili_optimizer.so
              echo "Copied $f -> mili-rust/build/rust/mili_optimizer.so"
              break
            fi
          done
          
          if [ -f "mili-rust/build/rust/mili_optimizer.so" ] || [ -f "mili-rust/build/rust/libmili_optimizer.so" ] || \
             [ -f "mili-rust/build/rust/mili_optimizer.dll" ] || [ -f "mili-rust/build/rust/libmili_optimizer.dll" ]; then
            echo "Rust optimizer binary exists"
            ls -la mili-rust/build/rust/
          else
            echo "Rust optimizer binary missing"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}
          gradle-home-cache-cleanup: true
          cache-exclude: |
            **/paperweight/**
            **/caches/paperweight/**

      - name: Apply All Patches
        run: ./gradlew applyAllPatches --no-configuration-cache

      # paperweight applies patches in place, so after a failure the partially patched tree is
      # still on disk. This distinguishes the two possible causes and captures the real
      # surrounding lines needed to rewrite a hunk whose context drifted:
      #   * the change is already present  -> the patch series is registered at two stages and
      #     this second application is a duplicate
      #   * the change is absent           -> the hunk context drifted as the target tree moved
      # Note: `find` must not be depth limited - the Minecraft sources live at
      # <fork>/src/minecraft/java/net/... which is deeper than a naive limit.
      - name: Dump patch failure context
        if: failure()
        run: |
          set -ux
          echo "=== 1. every DedicatedServer.java on disk ==="
          find . -name DedicatedServer.java -not -path './.git/*' 2>/dev/null | head -20 || true

          echo "=== 2. target region + markers ==="
          for f in $(find . -name DedicatedServer.java -not -path './.git/*' 2>/dev/null | head -2); do
            echo "===== $f : lines 195-285 ====="
            sed -n '195,285p' "$f" || true
            echo "----- markers in $f -----"
            grep -n 'loadConfigFiles\|initializeGlobalConfiguration\|initializeWorldDefaultsConfiguration\|spark.enableEarlyIfRequested\|Paper end - initialize global' "$f" || echo '(no markers found)'
          done

          echo "=== 3. reject files ==="
          find . -name '*.rej' -not -path './.git/*' 2>/dev/null | head -10 || true

          echo "=== 4. is the change already committed in the patch target repo? ==="
          if [ -d folia-server/.git ] || [ -f folia-server/.git ]; then
            echo "--- git log ---"
            git -C folia-server log --oneline -3 2>&1 | head -5 || true
            echo "--- loadConfigFiles in HEAD? ---"
            git -C folia-server grep -c 'loadConfigFiles' HEAD -- '*DedicatedServer.java' 2>/dev/null || echo '(not found in HEAD)'
            echo "--- initConfigs in HEAD? ---"
            git -C folia-server grep -c 'initConfigs' HEAD -- '*/Main.java' 2>/dev/null || echo '(not found in HEAD)'
            echo "--- working tree modifications ---"
            git -C folia-server status --short 2>/dev/null | head -20 || true
          else
            echo "folia-server is not a git repo"
          fi

          echo "=== 5. Main.java markers ==="
          for f in $(find . -name Main.java -path '*net/minecraft/server/Main.java' -not -path './.git/*' 2>/dev/null | head -3); do
            echo "--- $f ---"
            grep -n 'initConfigs\|loadConfigFiles' "$f" || echo '(no markers)'
          done

          echo "=== 6. leftover git am series ==="
          for r in $(find . -maxdepth 10 -type d -name 'rebase-apply' 2>/dev/null | head -2); do
            echo "--- $r : file count ---"
            ls "$r" 2>/dev/null | wc -l || true
          done

      - name: Verify Generated Source
        run: |
          echo "=== Checking generated source dirs ==="
          # folia-server is a submodule working copy: patches are applied directly into it,
          # so it is always present on disk. Only the pure-generated outputs are listed here.
          for d in paper-server paper-api folia-api; do
            if [ -d "$d" ] && [ "$(ls -A $d 2>/dev/null)" ]; then
              echo "OK: $d/ exists ($(find $d -name '*.java' | wc -l) java files)"
            else
              echo "MISSING: $d/ (not produced by any registered upstream - see known gap)"
            fi
          done

      - name: Inject Kotlin Config
        run: python3 scripts/inject_kotlin.py

        # NOTE: the previous "Kaiiju Entity Throttle Validation" and "Verify CIS Source Files"
        # steps were removed. They asserted files under mili-server/src/main/java/fun/bm/mili/kaiiju
        # and .../fun/bm/mili/scheduler that have never existed in this repository, yet they only
        # printed WARN lines - a permanently green check guarding nothing. Re-add them only once
        # the corresponding components are actually implemented, and make them fail the build.

      - name: Build Paperclip Jar
        run: ./gradlew :mili-server:createPaperclipJar --no-configuration-cache -PbstatsPluginId=${{ secrets.BSTATS_PLUGIN_ID }}

      - name: Post-Build Jar Smoke Test
        run: |
          JAR_PATH="mili-server/build/libs"
          echo "=== Jar Smoke Test ==="
          JAR=""
          for candidate in "$JAR_PATH"/*-paperclip-*.jar "$JAR_PATH"/*-mojmap-*.jar; do
            [ -f "$candidate" ] && JAR="$candidate" && break
          done
          if [ -n "$JAR" ]; then
            JAR_SIZE=$(stat -c%s "$JAR" 2>/dev/null || stat --format=%s "$JAR" 2>/dev/null || echo "unknown")
            echo "OK: JAR built - $JAR (${JAR_SIZE} bytes)"
            echo ""
            echo "=== Mili classes packaged into the jar ==="
            MILI_COUNT=$(unzip -l "$JAR" 2>/dev/null | grep -c 'fun/bm/mili/' || echo 0)
            echo "fun/bm/mili classes found: ${MILI_COUNT}"
            # The Mili/Luminol feature patches are what pull these classes into server code.
            # If applyAllPatches silently skipped a patch set, this count drops to near zero.
            if [ "${MILI_COUNT}" -lt 20 ]; then
              echo "WARN: suspiciously few fun/bm/mili classes - verify the patch set was applied"
            fi
          else
            echo "WARN: No server JAR found at $JAR_PATH"
          fi

      - name: Check for Pending Patch Rebuild
        run: |
          # Patched sources were historically generated under mili-server/src/minecraft.
          # After the Folia rebase they are applied into the folia-server submodule working
          # copy instead, which is why the old path check silently stopped reporting anything.
          PENDING=0
          if git status --porcelain --untracked-files=all -- mili-server/src/minecraft/ | grep -q "mili-server/src/minecraft/"; then
            echo "WARN: mili-server/src/minecraft has uncommitted changes"
            git status --porcelain --untracked-files=all -- mili-server/src/minecraft/ | head -50
            PENDING=1
          fi
          # Inside the submodule, untracked files are what indicate a missing rebuild.
          SUBDIRTY=$(cd folia-server 2>/dev/null && git status --porcelain --untracked-files=all | wc -l || echo 0)
          echo "folia-server working copy: ${SUBDIRTY} modified/untracked entries"
          if [ "${SUBDIRTY}" -gt 0 ]; then
            echo "WARN: applied patches produced changes that were not folded back into patch files"
            (cd folia-server && git status --porcelain --untracked-files=all | head -50)
            PENDING=1
          fi
          if [ "${PENDING}" -eq 0 ]; then
            echo "OK: No pending patch rebuild needed"
          fi

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.project_id_b || 'Mili' }} CI Artifacts
          path: mili-server/build/libs/*-paperclip-*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: true
          include-hidden-files: false

      - name: Set Environment
        if: github.event_name != 'pull_request'
        run: sh scripts/SetENV.sh

      - name: Check If Release Exists
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          git fetch --tags
          if [ -n "$(git tag -l "${{ env.tag }}")" ]; then
            echo "Release already exists"
            release_exists=true
          else
            echo "Release does not exist"
            release_exists=false
          fi
          if [ "$release_exists" == "true" ]; then
            counter=1
            while [ -n "$(git tag -l "${{ env.tag }}-${counter}")" ]; do
              counter=$((counter + 1))
            done
            echo "tag=${{ env.tag }}-${counter}" >> $GITHUB_ENV
            echo "release_count= - ${counter}" >> $GITHUB_ENV
          fi
          echo "release_exists=${release_exists}" >> $GITHUB_ENV

      - name: Check If Branch In Expectations
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          if [[ "$GITHUB_REF_NAME" == ver/* ]] || [[ "$GITHUB_REF_NAME" == exp/* ]] || [[ "$GITHUB_REF_NAME" == dev/* ]] || [[ "$GITHUB_REF_NAME" == master ]]; then
            echo "unexpect=false" >> $GITHUB_ENV
          else
            echo "unexpect=true" >> $GITHUB_ENV
          fi

      - name: Create Release - Pre Process
        if: ( github.event_name != 'pull_request' && env.unexpect != 'true' && env.flag_release == 'true' && env.release_exists != 'true' && inputs.force-release != '2' ) || inputs.force-release == '1'
        run: |
          if [ "${{ inputs.comments }}" == "" ]; then
            echo "No comments provided"
            echo "flag_comment=false" >> $GITHUB_ENV
          else
            echo "Comments provided: ${{ inputs.comments }}"
            echo "flag_comment=true" >> $GITHUB_ENV
          fi

      - name: Create Release - No Comment
        if: env.flag_comment == 'false' && github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} ${{ env.mcversion }} - ${{ env.commit_id }}${{ env.release_count }}
          body: |
            📦Version: `${{ env.mcversion }}` | Commit ${{ env.commit_id }} [![download](https://img.shields.io/github/downloads/LuminolMC/${{ env.project_id }}/${{ env.tag }}/total?color=red&style=flat)
            This release is automatically compiled by GitHub Actions
            ### Branch Info
            > ${{ github.ref_name }}
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: ${{ env.jar_dir }}
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release - With Comment
        if: env.flag_comment == 'true' && github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} ${{ env.mcversion }} - ${{ env.commit_id }}${{ env.release_count }}
          body: |
            📦Version: `${{ env.mcversion }}` | Commit ${{ env.commit_id }} [![download](https://img.shields.io/github/downloads/LuminolMC/${{ env.project_id }}/${{ env.tag }}/total?color=red&style=flat)
            This release is automatically compiled by GitHub Actions
            ### Comments
            > ${{ inputs.comments }}
            ### Branch Info
            > ${{ github.ref_name }}
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: ${{ env.jar_dir }}
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}
