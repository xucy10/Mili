name: mili CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      force-release:
        description: "Force release control"
        required: false
        default: ""
      force-push:
        description: "Force push control"
        required: false
        default: ""
      comments:
        description: "Add comments to release"
        required: false
        default: ""

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUST_TARGETS: x86_64-pc-windows-gnu,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Rust toolchain (add all targets)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install system cross toolchains and build deps (mingw, aarch64, lld, clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y clang lld build-essential pkg-config curl git
          sudo apt-get install -y libssl-dev zlib1g-dev

      - name: Install cargo-zigbuild and add cargo bin to PATH
        run: |
          cargo install cargo-zigbuild --locked || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Optionally install osxcross (for macOS cross-compilation)
        shell: bash
        run: |
          set -eux
          if [ -z "${{ secrets.OSX_SDK_BASE64 }}" ]; then
            echo "No OSX_SDK_BASE64 secret provided; skipping osxcross install."
            exit 0
          fi
          sudo apt-get install -y cmake nasm
          git clone https://github.com/tpoechtrager/osxcross /opt/osxcross
          mkdir -p /opt/osxcross/tarballs
          echo "${{ secrets.OSX_SDK_BASE64 }}" | base64 -d > /tmp/OSX_SDK.tar.xz
          mv /tmp/OSX_SDK.tar.xz /opt/osxcross/tarballs/
          cd /opt/osxcross
          ./tools/get_dependencies.sh || true
          UNATTENDED=1 SDK_VERSION=MacOSX ./build.sh || ( echo "osxcross build failed"; exit 1 )
          echo "/opt/osxcross/target/bin" >> $GITHUB_PATH

      - name: Verify toolchain and linkers
        run: |
          rustc --version
          cargo --version
          zig version || true
          if command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo-zigbuild --version || true
          else
            echo "WARN: cargo-zigbuild not available"
          fi
          which x86_64-w64-mingw32-gcc || echo "mingw not found in PATH"
          which aarch64-linux-gnu-gcc || echo "aarch64 cross-gcc not found in PATH"
          if [ -d /opt/osxcross ]; then
            which o64-clang || which o64-clang-12 || echo "osxcross clang not found"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git User Details
        run: |
          git config --global user.email "282142033+xucy10@users.noreply.github.com"
          git config --global user.name "Mili CI"
          git config --global advice.mergeConflict false
          git config --global init.defaultBranch main

      - name: Clean build artifacts
        run: |
          rm -rf mili-server/build mili-api/build
          rm -rf mili-server/src/minecraft
          rm -rf .gradle/caches/paperweight
          rm -rf .gradle/configuration-cache

      - name: Build Rust Optimizer (cross targets)
        env:
          RUST_TARGETS: ${{ env.RUST_TARGETS }}
          OSX_SDKROOT: /opt/osxcross/target/SDK/MacOSX.sdk
        run: |
          set -eux
          export PATH="$PATH:$HOME/.cargo/bin:/opt/osxcross/target/bin"
          export CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc || true
          export CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc || true
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          ./gradlew :mili-rust:stageRustBinary --no-configuration-cache

      - name: Verify Rust Optimizer Binary
        run: |
          if [ -f "mili-rust/build/rust/mili_optimizer.so" ]; then
            echo "Rust optimizer binary exists"
            ls -la mili-rust/build/rust || true
          else
            echo "Rust optimizer binary missing; list build output"
            ls -la mili-rust/build || true
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}
          gradle-home-cache-cleanup: true
          cache-exclude: |
            **/paperweight/**
            **/caches/paperweight/**

      - name: Download Hyacinthusclip
        run: |
          mkdir -p libs
          CLIP_VERSION=$(grep clipVersion gradle.properties | cut -d= -f2)
          echo "Downloading hyacinthusclip v${CLIP_VERSION}"
          curl -sL "https://github.com/xucy10/Hyacinthusclip/releases/download/v${CLIP_VERSION}/hyacinthusclip-${CLIP_VERSION}.jar" -o libs/hyacinthusclip.jar
          ls -la libs/hyacinthusclip.jar

      - name: Apply All Patches
        run: ./gradlew applyAllPatches --no-configuration-cache

      - name: Verify Generated Source
        run: |
          echo "=== Checking generated API source dirs ==="
          for d in paper-api folia-api mili-api paper-server folia-server mili-server; do
            if [ -d "$d" ] && [ "$(ls -A $d 2>/dev/null)" ]; then
              echo "OK: $d/ exists ($(find $d -name '*.java' | wc -l) java files)"
            else
              echo "MISSING: $d/"
            fi
          done

      - name: Inject Kotlin Config
        run: python3 scripts/inject_kotlin.py

      - name: Kaiiju Entity Throttle Validation
        run: |
          echo "=== Kaiiju Port: verifying entity throttler ==="
          for f in "MiliEntityThrottler.java" "MiliEntityLimitsConfig.java" "AsyncPathfindingExecutor.java"; do
            path="mili-server/src/main/java/fun/bm/mili/kaiiju/$f"
            if [ -f "$path" ]; then
              echo "OK: $f ($(wc -l < $path) lines)"
            else
              echo "WARN: $f not found"
            fi
          done

      - name: Verify CIS Source Files
        run: |
          CIS_DIR="mili-server/src/main/java/fun/bm/mili/scheduler"
          COUNT=0
          for f in "$CIS_DIR"/*.java "$CIS_DIR"/border/*.java "$CIS_DIR"/group/*.java; do
            if [ -f "$f" ]; then
              LINES=$(wc -l < "$f")
              echo "  CIS: $(basename $f) (${LINES} lines)"
              COUNT=$((COUNT + 1))
            fi
          done
          echo "Total CIS source files: ${COUNT}"

      - name: Build Paperclip Jar
        run: ./gradlew :mili-server:createMojmapPaperclipJar --no-configuration-cache -PbstatsPluginId=${{ secrets.BSTATS_PLUGIN_ID }}

      - name: Post-Build CIS Smoke Test
        run: |
          JAR_PATH="mili-server/build/libs"
          echo "=== CIS Smoke Test ==="
          if ls "$JAR_PATH"/*-paperclip-*-mojmap.jar 1>/dev/null 2>&1; then
            JAR=$(ls "$JAR_PATH"/*-paperclip-*-mojmap.jar | head -1)
            JAR_SIZE=$(stat --format=%s "$JAR" 2>/dev/null || stat -f%z "$JAR" 2>/dev/null)
            echo "OK: JAR built — $JAR (${JAR_SIZE} bytes)"
            echo ""
            echo "=== Available Feature Flags (config-driven) ==="
            echo "  CIS:               ChunkIndependentConfig.enabled"
            echo "  Kaiiju Throttler:  MiliEntityLimitsConfig.enabled"
            echo "  Async Pathfinding: ChunkIndependentConfig.enabled"
            echo ""
          else
            echo "WARN: No paperclip JAR found at $JAR_PATH"
          fi

      - name: Check for Pending Patch Rebuild
        run: |
          if git diff --name-only | grep -q "^mili-server/src/minecraft/"; then
            echo "WARN: Patched source has uncommitted changes — run 'rebuildPatches' to generate patch files"
            git diff --stat -- "mili-server/src/minecraft/"
          else
            echo "OK: No pending patch rebuild needed"
          fi

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.project_id_b }} CI Artifacts
          path: mili-server/build/libs/*-paperclip-*-mojmap.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: true
          include-hidden-files: false

      - name: Set Environment
        if: github.event_name != 'pull_request'
        run: sh scripts/SetENV.sh

      - name: Check If Release Exists
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          git fetch --tags
          if [ -n "$(git tag -l "${{ env.tag }}")" ]; then
            echo "Release already exists"
            release_exists=true
          else
            echo "Release does not exist"
            release_exists=false
          fi
          if [ "$release_exists" == "true" ]; then
            counter=1
            while [ -n "$(git tag -l "${{ env.tag }}-${counter}")" ]; do
              counter=$((counter + 1))
            done
            echo "tag=${{ env.tag }}-${counter}" >> $GITHUB_ENV
            echo "release_count= - ${counter}" >> $GITHUB_ENV
          fi
          echo "release_exists=${release_exists}" >> $GITHUB_ENV

      - name: Check If Branch In Expectations
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          if [[ "$GITHUB_REF_NAME" == ver/* ]] || [[ "$GITHUB_REF_NAME" == exp/* ]] || [[ "$GITHUB_REF_NAME" == dev/* ]] || [[ "$GITHUB_REF_NAME" == master ]]; then
            echo "unexpect=false" >> $GITHUB_ENV
          else
            echo "unexpect=true" >> $GITHUB_ENV
          fi

      - name: Create Release - Pre Process
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          if [ "${{ inputs.comments }}" == "" ]; then
            echo "No comments provided"
            echo "flag_comment=false" >> $GITHUB_ENV
          else
            echo "Comments provided: ${{ inputs.comments }}"
            echo "flag_comment=true" >> $GITHUB_ENV
          fi

      - name: Create Release - No Comment
        if: env.flag_comment == 'false' && github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} ${{ env.mcversion }} - ${{ env.commit_id }}${{ env.release_count }}
          body: |
            📦Version: `${{ env.mcversion }}` | Commit ${{ env.commit_id }}
            This release is automatically compiled by GitHub Actions
            ### Branch Info
            > ${{ github.ref_name }}
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: ${{ env.jar_dir }}
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release - With Comment
        if: env.flag_comment == 'true' && github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} ${{ env.mcversion }} - ${{ env.commit_id }}${{ env.release_count }}
          body: |
            📦Version: `${{ env.mcversion }}` | Commit ${{ env.commit_id }}
            This release is automatically compiled by GitHub Actions
            ### Comments
            > ${{ inputs.comments }}
            ### Branch Info
            > ${{ github.ref_name }}
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: ${{ env.jar_dir }}
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Rust toolchain (add all targets; linkers installed later)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install system cross toolchains and build deps (mingw, aarch64, lld, clang)
        run: |
          sudo apt-get update
          # mingw for Windows linking
          sudo apt-get install -y mingw-w64
          # cross gcc for aarch64 linux
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # linkers/clang/lld
          sudo apt-get install -y clang lld build-essential pkg-config curl git
          # (optional) additional tools
          sudo apt-get install -y libssl-dev zlib1g-dev

      - name: Install cargo-zigbuild and add cargo bin to PATH
        run: |
          cargo install cargo-zigbuild --locked || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Optionally install osxcross (for macOS cross-compilation)
        # This step will be a no-op if you haven't set the OSX_SDK_BASE64 secret.
        run: |
          set -eux
          # Expect a base64-encoded tar.xz of a MacOSX*.sdk (e.g. MacOSX12.6.sdk.tar.xz)
          if [ -z "${{ secrets.OSX_SDK_BASE64 }}" ]; then
            echo "No OSX_SDK_BASE64 secret provided; skipping osxcross install. To cross-build macOS, add SDK as secret OSX_SDK_BASE64."
            exit 0
          fi

          # Prepare osxcross
          sudo apt-get install -y cmake nasm
          git clone https://github.com/tpoechtrager/osxcross /opt/osxcross
          mkdir -p /opt/osxcross/tarballs
          # Decode SDK tarball secret into tar.xz and move into tarballs folder.
          echo "${{ secrets.OSX_SDK_BASE64 }}" | base64 -d > /tmp/OSX_SDK.tar.xz
          mv /tmp/OSX_SDK.tar.xz /opt/osxcross/tarballs/
          cd /opt/osxcross
          # install dependencies (script may be no-op on some runners)
          ./tools/get_dependencies.sh || true
          # Build osxcross toolchain (UNATTENDED avoids interactive prompts)
          UNATTENDED=1 SDK_VERSION=MacOSX ./build.sh || ( echo "osxcross build failed"; exit 1 )
          # add osxcross toolchain to PATH
          echo "/opt/osxcross/target/bin" >> $GITHUB_PATH
        shell: bash

      - name: Verify toolchain and linkers
        run: |
          rustc --version
          cargo --version
          zig version || true
          # cargo-zigbuild may be installed; if not, warn but continue
          if command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo-zigbuild --version || true
          else
            echo "WARN: cargo-zigbuild not available - Gradle may fallback to cargo native build"
          fi
          # check mingw and aarch64 GCC
          which x86_64-w64-mingw32-gcc || echo "mingw not found in PATH"
          which aarch64-linux-gnu-gcc || echo "aarch64 cross-gcc not found in PATH"
          # check osxcross clang if installed
          if [ -d /opt/osxcross ]; then
            which o64-clang || which o64-clang-12 || echo "osxcross clang not found"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git User Details
        run: |
          git config --global user.email "282142033+xucy10@users.noreply.github.com"
          git config --global user.name "Mili CI"
          git config --global advice.mergeConflict false
          git config --global init.defaultBranch main

      - name: Clean build artifacts
        run: |
          rm -rf mili-server/build mili-api/build
          rm -rf mili-server/src/minecraft
          rm -rf .gradle/caches/paperweight
          rm -rf .gradle/configuration-cache

      - name: Build Rust Optimizer (cross targets)
        # We rely on the Gradle task :mili-rust:stageRustBinary to detect cargo-zigbuild and zig.
        # Gradle plugin should prefer 'cargo zigbuild' if available; otherwise we set environment
        # variables so linkers are found.
        env:
          # tell cargo/cross/gradle which targets to attempt
          RUST_TARGETS: ${{ env.RUST_TARGETS }}
          # If osxcross installed, set SDKROOT like this; gradle/cargo build steps may pick it up.
          OSX_SDKROOT: /opt/osxcross/target/SDK/MacOSX.sdk || true
        run: |
          set -eux
          # make sure PATH contains mingw and osxcross toolchain binaries (if present)
          export PATH="$PATH:$HOME/.cargo/bin:/opt/osxcross/target/bin"
          # Optional: set CC for cross targets so cargo picks the right compiler
          export CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc || true
          export CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc || true
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          # If using cargo-zigbuild, cargo-zigbuild will use zig as linker if set up.
          ./gradlew :mili-rust:stageRustBinary --no-configuration-cache

      - name: Verify Rust Optimizer Binary
        run: |
          if [ -f "mili-rust/build/rust/mili_optimizer.so" ]; then
            echo "Rust optimizer binary exists"
            ls -la mili-rust/build/rust || true
          else
            echo "Rust optimizer binary missing; list build output"
            ls -la mili-rust/build || true
            exit 1
          fi

      # continue with the rest of your original pipeline (paperclip build etc.)

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set Up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Zig for Cross-Compilation
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: |
          cargo install cargo-zigbuild --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Toolchain
        run: |
          rustc --version
          cargo --version
          zig version
          cargo zigbuild --version || echo "WARN: cargo-zigbuild not found on PATH"
          rustup target list --installed

      # 核心改动：优化 Gradle 缓存配置
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}
          gradle-home-cache-cleanup: true
          cache-exclude: |
            **/paperweight/**
            **/caches/paperweight/**

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git User Details
        run: |
          git config --global user.email "282142033+xucy10@users.noreply.github.com"
          git config --global user.name "Mili CI"
          git config --global advice.mergeConflict false
          git config --global init.defaultBranch main

      - name: Clean build artifacts
        run: |
          echo "=== Pre-clean state ==="
          rm -rf mili-server/build mili-api/build
          rm -rf mili-server/src/minecraft
          rm -rf .gradle/caches/paperweight
          rm -rf .gradle/configuration-cache
          echo "=== Post-clean state ==="
          echo "Cleaned paperweight cache to ensure fresh upstream checkout"

      - name: Download Hyacinthusclip
        run: |
          mkdir -p libs
          CLIP_VERSION=$(grep clipVersion gradle.properties | cut -d= -f2)
          echo "Downloading hyacinthusclip v${CLIP_VERSION}"
          curl -sL "https://github.com/xucy10/Hyacinthusclip/releases/download/v${CLIP_VERSION}/hyacinthusclip-${CLIP_VERSION}.jar" -o libs/hyacinthusclip.jar
          ls -la libs/hyacinthusclip.jar

      - name: Apply All Patches
        run: ./gradlew applyAllPatches --no-configuration-cache

      - name: Verify Generated Source
        run: |
          echo "=== Checking generated API source dirs ==="
          for d in paper-api folia-api mili-api paper-server folia-server mili-server; do
            if [ -d "$d" ] && [ "$(ls -A $d 2>/dev/null)" ]; then
              echo "OK: $d/ exists ($(find $d -name '*.java' | wc -l) java files)"
            else
              echo "MISSING: $d/"
            fi
          done

      - name: Inject Kotlin Config
        run: python3 scripts/inject_kotlin.py

      - name: Kaiiju Entity Throttle Validation
        run: |
          echo "=== Kaiiju Port: verifying entity throttler ==="
          for f in "MiliEntityThrottler.java" "MiliEntityLimitsConfig.java" "AsyncPathfindingExecutor.java"; do
            path="mili-server/src/main/java/fun/bm/mili/kaiiju/$f"
            if [ -f "$path" ]; then
              echo "OK: $f ($(wc -l < $path) lines)"
            else
              echo "WARN: $f not found"
            fi
          done

      - name: Verify CIS Source Files
        run: |
          CIS_DIR="mili-server/src/main/java/fun/bm/mili/scheduler"
          COUNT=0
          for f in "$CIS_DIR"/*.java "$CIS_DIR"/border/*.java "$CIS_DIR"/group/*.java; do
            if [ -f "$f" ]; then
              LINES=$(wc -l < "$f")
              echo "  CIS: $(basename $f) (${LINES} lines)"
              COUNT=$((COUNT + 1))
            fi
          done
          echo "Total CIS source files: ${COUNT}"

      - name: Build Rust Optimizer
        run: ./gradlew :mili-rust:stageRustBinary --no-configuration-cache

      - name: Verify Rust Optimizer Binary
        run: |
            if [ -f "mili-rust/build/rust/mili_optimizer.so" ]; then
            echo "Rust optimizer binary exists"
            ls -la mili-rust/build/rust
            else
            echo "Rust optimizer binary missing"
            ls -la mili-rust/build/ || echo "mili-rust/build directory does not exist"
            exit 1
            fi
      - name: Build Paperclip Jar
        run: ./gradlew :mili-server:createMojmapPaperclipJar --no-configuration-cache -PbstatsPluginId=${{ secrets.BSTATS_PLUGIN_ID }}

      - name: Post-Build CIS Smoke Test
        run: |
          JAR_PATH="mili-server/build/libs"
          echo "=== CIS Smoke Test ==="
          if ls "$JAR_PATH"/*-paperclip-*-mojmap.jar 1>/dev/null 2>&1; then
            JAR=$(ls "$JAR_PATH"/*-paperclip-*-mojmap.jar | head -1)
            JAR_SIZE=$(stat --format=%s "$JAR" 2>/dev/null || stat -f%z "$JAR" 2>/dev/null)
            echo "OK: JAR built — $JAR (${JAR_SIZE} bytes)"
            echo ""
            echo "=== Available Feature Flags (config-driven) ==="
            echo "  CIS:               ChunkIndependentConfig.enabled"
            echo "  Kaiiju Throttler:  MiliEntityLimitsConfig.enabled"
            echo "  Async Pathfinding: ChunkIndependentConfig.enabled"
            echo ""
            echo "=== To generate lifecycle hooks (if needed) ==="
            echo "  1. ./gradlew applyAllPatches"
            echo "  2. Edit mili-server/src/minecraft/ (RegionizedServer.java)"
            echo "  3. ./gradlew :mili-server:rebuildPatches"
            echo "  4. Commit generated patches"
          else
            echo "WARN: No paperclip JAR found at $JAR_PATH"
          fi

      - name: Check for Pending Patch Rebuild
        run: |
          if git diff --name-only | grep -q "^mili-server/src/minecraft/"; then
            echo "WARN: Patched source has uncommitted changes — run 'rebuildPatches' to generate patch files"
            git diff --stat -- "mili-server/src/minecraft/"
          else
            echo "OK: No pending patch rebuild needed"
          fi

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.project_id_b }} CI Artifacts
          path: mili-server/build/libs/*-paperclip-*-mojmap.jar
          if-no-files-found: error
          retention-days: 14
