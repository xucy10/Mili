name: mili CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      force-release:
        description: "Force disable release if you enter 2, force release if you enter 1, default release if not released else skip release"
        required: false
        default: ""
      force-push:
        description: "Force disable push to repo if you enter 2, force push to repo if you enter 1, default push if not released else skip push repo"
        required: false
        default: ""
      comments:
        description: "Add comments to release"
        required: false
        default: ""

permissions: write-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: default
    timeout-minutes: 60
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set Up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Verify Rust Toolchain
        run: |
          rustc --version
          cargo --version

      # 核心改动：优化 Gradle 缓存配置
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}
          gradle-home-cache-cleanup: true
          cache-exclude: |
            **/paperweight/**
            **/caches/paperweight/**

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git User Details
        run: |
          git config --global user.email "xucy@Mili.com"
          git config --global user.name "Mili CI"
          git config --global advice.mergeConflict false
          git config --global init.defaultBranch main

      - name: Clean paperweight caches (aggressive)
        run: |
          echo "=== Pre-clean state ==="
          rm -rf mili-server/build mili-api/build
          find . -type d -name "taskCache" -path "*/paperweight/*" -exec rm -rf {} + 2>/dev/null || true
          echo "=== Post-clean state ==="
          ls -la .gradle/caches/paperweight 2>/dev/null || echo "paperweight cache removed"
          rm -rf .gradle/caches/paperweight/upstreams/server-work

      - name: Init Luminol Local Repo
        run: |
          cd Luminol-ver-1.21.11
          git init
          git add -A
          git commit -m "luminol"
          cd ..

      - name: Apply All Patches
        run: ./gradlew applyAllPatches

      - name: Inject Kotlin Config
        run: python3 scripts/inject_kotlin.py

      - name: Kaiiju Entity Throttle Validation
        run: |
          echo "=== Kaiiju Port: verifying entity throttler ==="
          for f in "MiliEntityThrottler.java" "MiliEntityLimitsConfig.java" "AsyncPathfindingExecutor.java"; do
            path="mili-server/src/main/java/fun/bm/mili/kaiiju/$f"
            if [ -f "$path" ]; then
              echo "OK: $f ($(wc -l < $path) lines)"
            else
              echo "WARN: $f not found"
            fi
          done

      - name: Verify CIS Source Files
        run: |
          CIS_DIR="mili-server/src/main/java/fun/bm/mili/scheduler"
          COUNT=0
          for f in "$CIS_DIR"/*.java "$CIS_DIR"/border/*.java "$CIS_DIR"/group/*.java; do
            if [ -f "$f" ]; then
              LINES=$(wc -l < "$f")
              echo "  CIS: $(basename $f) (${LINES} lines)"
              COUNT=$((COUNT + 1))
            fi
          done
          echo "Total CIS source files: ${COUNT}"

      - name: Build Rust Optimizer
        run: ./gradlew :mili-rust:stageRustBinary

      - name: Verify Rust Optimizer Binary
        run: |
          if [ -f "mili-rust/build/rust/optimizer" ] || [ -f "mili-rust/build/rust/optimizer.exe" ]; then
            echo "Rust optimizer binary exists"
            ls -la mili-rust/build/rust
          else
            echo "Rust optimizer binary missing"
            exit 1
          fi
      - name: Clean and Rebuild
        run: |
          ./gradlew clean && rm -rf .gradle/caches/paperweight

      - name: Build Rust Optimizer
        run: ./gradlew :mili-rust:stageRustBinary

      - name: Build Paperclip Jar
        run: ./gradlew :mili-server:createMojmapPaperclipJar --no-configuration-cache

      - name: Post-Build CIS Smoke Test
        run: |
          JAR_PATH="mili-server/build/libs"
          echo "=== CIS Smoke Test ==="
          if ls "$JAR_PATH"/*-paperclip-*-mojmap.jar 1>/dev/null 2>&1; then
            JAR=$(ls "$JAR_PATH"/*-paperclip-*-mojmap.jar | head -1)
            JAR_SIZE=$(stat --format=%s "$JAR" 2>/dev/null || stat -f%z "$JAR" 2>/dev/null)
            echo "OK: JAR built — $JAR (${JAR_SIZE} bytes)"
            echo ""
            echo "=== Available Feature Flags (config-driven) ==="
            echo "  CIS:               ChunkIndependentConfig.enabled"
            echo "  Kaiiju Throttler:  MiliEntityLimitsConfig.enabled"
            echo "  Async Pathfinding: ChunkIndependentConfig.enabled"
            echo ""
            echo "=== To generate lifecycle hooks (if needed) ==="
            echo "  1. ./gradlew applyAllPatches"
            echo "  2. Edit mili-server/src/minecraft/ (RegionizedServer.java)"
            echo "  3. ./gradlew :mili-server:rebuildPatches"
            echo "  4. Commit generated patches"
          else
            echo "WARN: No paperclip JAR found at $JAR_PATH"
          fi

      - name: Check for Pending Patch Rebuild
        run: |
          if git diff --name-only | grep -q "^mili-server/src/minecraft/"; then
            echo "WARN: Patched source has uncommitted changes — run 'rebuildPatches' to generate patch files"
            git diff --stat -- "mili-server/src/minecraft/"
          else
            echo "OK: No pending patch rebuild needed"
          fi

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.project_id_b }} CI Artifacts
          path: mili-server/build/libs/*-paperclip-*-mojmap.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: true
          include-hidden-files: false

      - name: Set Environment
        if: github.event_name != 'pull_request'
        run: sh scripts/SetENV.sh

      - name: Check If Release Exists
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          git fetch --tags
          if [ -n "$(git tag -l "${{ env.tag }}")" ]; then
            echo "Release already exists"
            release_exists=true
          else
            echo "Release does not exist"
            release_exists=false
          fi
          if [ "$release_exists" == "true" ]; then
            counter=1
            while [ -n "$(git tag -l "${{ env.tag }}-${counter}")" ]; do
              counter=$((counter + 1))
            done
            echo "tag=${{ env.tag }}-${counter}" >> $GITHUB_ENV
            echo "release_count= - ${counter}" >> $GITHUB_ENV
          fi
          echo "release_exists=${release_exists}" >> $GITHUB_ENV

      - name: Check If Branch In Expectations
        if: github.event_name != 'pull_request' && env.flag_release == 'true'
        run: |
          if [[ "$GITHUB_REF_NAME" == ver/* ]] || [[ "$GITHUB_REF_NAME" == exp/* ]] || [[ "$GITHUB_REF_NAME" == dev/* ]] || [[ "$GITHUB_REF_NAME" == master ]]; then
            echo "Branch is in expected prefixes"
            echo "unexpect=false" >> $GITHUB_ENV
          else
            echo "Branch is NOT in expected prefixes"
            echo "unexpect=true" >> $GITHUB_ENV
          fi

      - name: Create Release - Pre Process
        if: ( github.event_name != 'pull_request' && !( env.unexpect == 'true' ) && env.flag_release == 'true' && env.release_exists != 'true' && !(inputs.force-release == '2')) || inputs.force-release == '1'
        run: |
          if [ "${{ inputs.comments }}" == "" ]; then
            echo "No comments provided"
            echo "flag_comment=false" >> $GITHUB_ENV
          else
            echo "Comments provided: ${{ inputs.comments }}"
            echo "flag_comment=true" >> $GITHUB_ENV
          fi

      - name: Create Release - No Comment
        if: env.flag_comment == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} ${{ env.mcversion }} - ${{ env.commit_id }}${{ env.release_count }}
          body: |
            📦Version: `${{ env.mcversion }}` | Commit ${{ env.commit_id }} [![download](https://img.shields.io/github/downloads/LuminolMC/${{ env.project_id }}/${{ env.tag }}/total?color=red&style=flat-square)](https://github.com/xucy10/${{ env.project_id }}/releases/download/${{ env.tag }}/${{ env.jar }})
            This release is automatically compiled by GitHub Actions
            ### Branch Info
            > ${{ github.ref_name }}
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: ${{ env.jar_dir }}
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release - With Comment
        if: env.flag_comment == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} ${{ env.mcversion }} - ${{ env.commit_id }}${{ env.release_count }}
          body: |
            📦Version: `${{ env.mcversion }}` | Commit ${{ env.commit_id }} [![download](https://img.shields.io/github/downloads/LuminolMC/${{ env.project_id }}/${{ env.tag }}/total?color=red&style=flat-square)](https://github.com/xucy10/${{ env.project_id }}/releases/download/${{ env.tag }}/${{ env.jar }})
            This release is automatically compiled by GitHub Actions
            ### Comments
            > ${{ inputs.comments }}
            ### Branch Info
            > ${{ github.ref_name }}
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: ${{ env.jar_dir }}
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}