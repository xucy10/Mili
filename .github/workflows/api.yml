name: Publish Mili API

on:
  workflow_dispatch:
  push:
    tags:
      - "api-*"

jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Publish API
        run: |
          ./gradlew :mili-api:publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
