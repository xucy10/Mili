[package]
name = "mili-rust-optimizer"
version = "0.1.0"
edition = "2021"

[lib]
name = "mili_optimizer"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.8"
jni = { version = "0.21", features = ["invocation"] }
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]