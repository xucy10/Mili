[package]
name = "mili-rust-optimizer"
version = "0.1.0"
edition = "2021"

[lib]
name = "mili_optimizer"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# rustd：Mili 常驻子进程守护进程（后台任务通道，崩溃隔离）。
# 构建：gradle 的 buildRustBinariesAll 已追加 `--bin rustd`，
# stageRustBinary 将产物以平台后缀名 staged 到 build/rust/rustd/。
[[bin]]
name = "rustd"
path = "src/bin/rustd/main.rs"

[dependencies]
rayon = "1.8"
jni = { version = "0.21", features = ["invocation"] }
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 外部动态库扩展（C ABI v1）加载；仅 dlopen/dlsym 绑定，不扩张 GLIBC 依赖面
libloading = "0.8"

[dev-dependencies]