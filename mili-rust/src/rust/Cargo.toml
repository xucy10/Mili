[package]
name = "mili-rust-optimizer"
version = "0.1.0"
edition = "2024"

[lib]
name = "mili_optimizer"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.12"
jni = { version = "0.21", features = ["invocation"] }
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

# ---------------------------------------------------------------------------
# Release profile — maximize optimizations for the native JNI library
# Mili start - fix: panic=unwind so catch_unwind works; overflow-checks=true to prevent UB
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
overflow-checks = true

# ---------------------------------------------------------------------------
# Clippy lints — enforce code quality, prevent regression
# ---------------------------------------------------------------------------
[lints.clippy]
# Deny correctness-critical lints
not_unsafe_ptr_arg_deref = "deny"
# Warn on common pitfalls
redundant_closure = "warn"
collapsible_match = "warn"
manual_map = "warn"
needless_range_loop = "warn"
too_many_arguments = "allow"
