group=fun.bm.mili
version=26.2-R0.1-SNAPSHOT
mcVersion=26.2
apiVersion=26.2
clipVersion=3.0.18
# SHA-256 of the exact riceear binary CI must use. The v3.0.18 tag shipped two
# different binaries under two asset names: hyacinthusclip-3.0.18.jar
# (2026-09-13, pre-2741279f0, resolves library patch data against the vanilla
# bundler -> NoSuchFileException on first launch, see issue #30) and
# riceear-3.0.18.jar (2026-09-14, fixed). CI verifies the download against this
# value; bump it together with clipVersion.
riceearSha256=9a530cd5b9bded99966d7dfad178de7ff1cca5b1bd2b3094fbbfe7044841829f
# Milihyacinthus (paperweight fork) 2.0.0-SNAPSHOT — rebranded to vanilla paperweight plugin ids
weightVersion=2.0.0-SNAPSHOT
release=1
# 0 for skip release, 1 for pre-release, 2 for release

foliaRef=57f643f10e0a9d01024773232d38ae666067d593

# --- Milihyacinthus download tuning (new in commit 5418e3d) ---
# Retries for failed downloads (exponential backoff; default 2)
paperweight.download.retries=3
# Mirror rewrite rules ("fromBase=toBase", comma-separated). Example (BMCLAPI):
# paperweight.download.mirrors=https://piston-meta.mojang.com=https://bmclapi2.bangbang93.com
# HTTP connection pool tuning (defaults: 24 total / 8 per route)
# paperweight.download.maxConnections=24
# paperweight.download.maxConnectionsPerRoute=16
# Override the Mojang version manifest URL (e.g. for mirrors)
# paperweight.mojangManifestUrl=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json

org.gradle.jvmargs=-Xmx2G -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
